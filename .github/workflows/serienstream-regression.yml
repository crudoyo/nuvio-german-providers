name: SerienStream regression
on:
  push:
    branches: [main]
    paths:
      - 'src/serienstream/**'
      - 'providers/serienstream.js'
      - 'src/huhuto/**'
      - 'providers/huhuto.js'
      - 'src/filmfrei24/**'
      - 'providers/filmfrei24.js'
      - 'tests/serienstream-jsoup.test.cjs'
      - '.github/workflows/serienstream-regression.yml'
  pull_request:
    paths:
      - 'src/serienstream/**'
      - 'providers/serienstream.js'
      - 'tests/serienstream-jsoup.test.cjs'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check providers/serienstream.js
      - run: node --check providers/huhuto.js
      - run: node --check providers/filmfrei24.js
      - run: node --check health.js
      - run: node --check src/serienstream/index.js
      - run: node --check src/huhuto/index.js
      - run: node --check src/filmfrei24/index.js
      - run: node tests/serienstream-jsoup.test.cjs
